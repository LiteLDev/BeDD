name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # levibuildscript derives the mod version from the latest tag

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua', 'xmake-requires.lock') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: git config --global core.longpaths true

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -p windows -v --target_type=client -y

      - run: xmake -v -y

      # xmake rewrote the lock with the client's pins only: the server builds from the committed one.
      - run: git checkout -- xmake-requires.lock

      - run: xmake f -a x64 -m release -p windows -v --target_type=server -y

      - run: xmake -v -y

      # BeDD.exe states the LeviLamina and game it is made for: both must be the ones xmake.lua builds against.
      - name: Check BuildInfo.cs matches xmake.lua
        shell: bash
        run: |
          ll=$(grep -oP 'add_requires\("levilamina \K[0-9.]+' xmake.lua)
          game="1.${ll%.*}"
          info=app/BeDD/Core/BuildInfo.cs
          grep -qF "LeviLaminaVersion = \"$ll\";" "$info" || { echo "::error file=$info::LeviLaminaVersion is not xmake.lua's $ll"; exit 1; }
          grep -qF "GameVersion = \"$game\";" "$info" || { echo "::error file=$info::GameVersion is not $game"; exit 1; }
          echo "LeviLamina $ll, game $game"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # NativeAOT links with the MSVC tools, which the SDK finds through vswhere.
      - name: Put vswhere on PATH
        shell: bash
        run: echo 'C:\Program Files (x86)\Microsoft Visual Studio\Installer' >> "$GITHUB_PATH"

      - run: dotnet test app/BeDD.slnx -c Release

      - run: dotnet publish app/BeDD/BeDD.csproj -c Release -o bin/app

      - uses: ./.github/actions/stage

      # Two versions of the MSI for the upgrade tests, then the installers of this commit.
      - name: Build the installers
        shell: bash
        run: |
          wix=packaging/wix
          dotnet build $wix/Package/BeDD.Package.wixproj -c Release -p:Platform=x64 -p:ProductVersion=0.0.1 --no-incremental
          mkdir -p bin/installer-test/old bin/installer-test/new bin/installer
          cp $wix/Package/bin/x64/Release/bedd.msi bin/installer-test/old/
          dotnet build $wix/Bundle/BeDD.Bundle.wixproj -c Release -p:Platform=x64 -p:ProductVersion=0.0.2 --no-incremental
          cp $wix/Package/bin/x64/Release/bedd.msi $wix/Bundle/bin/x64/Release/bedd-setup.exe bin/installer-test/new/
          dotnet build $wix/Bundle/BeDD.Bundle.wixproj -c Release -p:Platform=x64 --no-incremental
          cp $wix/Package/bin/x64/Release/bedd.msi bin/installer/bedd-windows-x64.msi
          cp $wix/Bundle/bin/x64/Release/bedd-setup.exe bin/installer/bedd-windows-x64-setup.exe

      - name: Test the installers
        shell: bash
        env:
          BEDD_MSI_OLD: bin/installer-test/old/bedd.msi
          BEDD_MSI: bin/installer-test/new/bedd.msi
          BEDD_SETUP: bin/installer-test/new/bedd-setup.exe
        run: node --test tests/installer/installer.test.mjs

      - name: Validate the AsyncAPI spec
        if: hashFiles('spec/bedd.asyncapi.yaml') != ''
        shell: bash
        run: npx -y @asyncapi/cli@latest validate spec/bedd.asyncapi.yaml

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/BeDD/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-server-windows-x64
          path: |
            bin/BeDD-server/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-app-windows-x64
          path: |
            bin/app/BeDD.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-installer-windows-x64
          path: |
            bin/installer/
