name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # levibuildscript derives the mod version from the latest tag

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua', 'xmake-requires.lock') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: git config --global core.longpaths true

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -p windows -v --target_type=client -y

      - run: xmake -v -y

      - name: Check PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem client, tools -Recurse -Include *.ps1, *.psm1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { throw "$bad PowerShell parse error(s)" }

      - name: Check BeDDSetup.psm1 sets up the LeviLamina of the build
        shell: pwsh
        run: |
          $ll = [regex]::Match((Get-Content xmake.lua -Raw), 'add_requires\("levilamina ([0-9.]+)"').Groups[1].Value
          $game = '1.' + ($ll -replace '\.\d+$', '')
          $setup = Get-Content client/BeDDSetup.psm1 -Raw
          if ($setup -notmatch "LeviLaminaVersion = '$([regex]::Escape($ll))'") { throw "client/BeDDSetup.psm1: LeviLaminaVersion is not xmake.lua's $ll" }
          if ($setup -notmatch "GameVersion\s+= '$([regex]::Escape($game))'") { throw "client/BeDDSetup.psm1: GameVersion is not $game" }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/BeDD/
